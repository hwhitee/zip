server:
  port: 8080

spring:
  application:
    name: wardsentinel-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:wardsentinel}
    username: ${POSTGRES_USER:wardsentinel}
    password: ${POSTGRES_PASSWORD:changeme_dev_only}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

inference:
  service:
    url: ${INFERENCE_SERVICE_URL:http://localhost:8001}
    connect-timeout-ms: 2000
    read-timeout-ms: 4000

safety-policy:
  version: "v1.0-deterministic"
  low-threshold: 0.35
  elevated-threshold: 0.60
  high-threshold: 0.80
  auto-escalate-delay-ms: 120000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
