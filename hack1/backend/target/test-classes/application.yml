server:
  port: 0

spring:
  application:
    name: wardsentinel-backend-test
  datasource:
    url: jdbc:h2:mem:wardsentinel_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

inference:
  service:
    url: http://localhost:8001
    connect-timeout-ms: 1000
    read-timeout-ms: 2000

safety-policy:
  version: "v1.0-deterministic"
  low-threshold: 0.35
  elevated-threshold: 0.60
  high-threshold: 0.80
  auto-escalate-delay-ms: 120000

cors:
  allowed-origins: "*"
